name: PR scrolling validation
on:
  push:
    branches: [fix/pr-code-scroll-performance]
permissions:
  contents: write
jobs:
  repair:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr-code-scroll-performance
      - name: Apply reviewed scrolling patch
        run: |
          if [ -f scripts/apply_pr_scroll_fix.py ]; then
            python3 scripts/apply_pr_scroll_fix.py
            cargo fmt --all
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/components/pull_requests.rs src/components/pull_requests/
            if ! git diff --cached --quiet; then
              git commit -m 'fix: virtualize pull request code scrolling'
              git push origin HEAD:fix/pr-code-scroll-performance
            fi
            cargo test components::pull_requests -- --nocapture
          else
            rustc --version
            cargo --version
          fi
